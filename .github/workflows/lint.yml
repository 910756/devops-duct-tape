name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x bin/ducttape lib/*.sh fixes/*.sh
      - name: Smoke test
        run: |
          bin/ducttape --help
          bin/ducttape retry --attempts 2 --delay 1 -- true
          bin/ducttape cert-expiry --days 1 github.com
